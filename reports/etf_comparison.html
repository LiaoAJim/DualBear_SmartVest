    let currentMode = appData.default_mode || 'drop';

    function renderView(mode) {
      currentMode = mode;
      const b = appData[mode];
      if (!b) return;

      // 1. 更新按鈕啟用狀態
      const btnDrop = document.getElementById('btn-drop');
      const btnRise = document.getElementById('btn-rise');

      btnRise.className = 'mode-btn' + (mode === 'rise' ? ' active rise' : '');

      const badge = document.getElementById('mode-badge');
      badge.innerText = b.mode_badge;
      badge.className = 'header-mode-badge ' + (mode === 'drop' ? 'mode-badge-drop' : 'mode-badge-rise');

      // 3. 更新副標題
      const subtitle = document.getElementById('header-subtitle');
      subtitle.innerHTML = `

      // 4. 更新卡片

          <div class="card-return ${c.return_class}">${c.return_str}</div>
          <div class="card-diff ${c.diff_class}">${c.diff_text}</div>
        </div>
      `).join('');

      // 5. 更新 Plotly 折線圖
      renderPlotlyChart(b);
    }

    function calculateOptimalChartHeight(traces, isMobile) {
      // 1. 基於視窗高度動態計算 (全覽視窗 65vh)
      const vhHeight = Math.round(window.innerHeight * 0.65);

      // 2. 基於數據最大/最小震幅 (Range Spread) 動態擴展，確保極端大跌或大漲時垂直刻度舒展
      let minY = 0, maxY = 0;
      traces.forEach(tr => {
        if (tr.y && tr.y.length > 0) {
          tr.y.forEach(v => {
            if (v < minY) minY = v;
            if (v > maxY) maxY = v;
          });
        }
      });
      const spread = Math.abs(maxY - minY);
      // 每 10% 震幅增加 40px，基礎高度 460px
      const spreadHeight = Math.round(460 + (spread * 4.2));

      // 3. 綜合兩者取最合適高度，並設定合理的防縮界限
      const minBound = isMobile ? 480 : 560;
      const maxBound = isMobile ? 680 : 820;
      let targetHeight = Math.max(vhHeight, spreadHeight);
      targetHeight = Math.min(Math.max(targetHeight, minBound), maxBound);

      return targetHeight;
    }

    function renderPlotlyChart(b) {
      const traces = b.traces;
      const isMobile = window.innerWidth <= 640;
      const isDesktopOrTablet = window.innerWidth > 640;
      const optimalHeight = calculateOptimalChartHeight(traces, isMobile);

      // 更新容器高度
      document.getElementById('chart').style.height = `${optimalHeight}px`;

      const layout = {
        height: optimalHeight,
        paper_bgcolor: 'rgba(0,0,0,0)',
        plot_bgcolor: 'rgba(0,0,0,0)',
        font: {
          family: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif',
          color: '#E2E8F0'
        },
        hoverlabel: {
          bgcolor: '#0F172A',
          bordercolor: '#38BDF8',
          font: {
            family: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif',
            size: 13,
            color: '#FFFFFF'
          }
        },
        margin: isMobile 
          ? { l: 42, r: 85, t: 25, b: 40 } 
          : { l: 55, r: 140, t: 55, b: 50 },
        hovermode: 'x unified',
        xaxis: {
          gridcolor: 'rgba(255, 255, 255, 0.08)',
          linecolor: 'rgba(255, 255, 255, 0.25)',
          tickfont: { color: '#CBD5E1', size: isMobile ? 10 : 12 },
          tickformat: '%m/%d',
          showspikes: true,
          spikemode: 'across',
          spikesnap: 'cursor',
          spikedash: 'dot',
          spikethickness: 1,
          spikecolor: '#94A3B8',
          fixedrange: false // 允許水平縮放拖曳
        },
        yaxis: {
          title: {
            text: isMobile ? '含息報酬 (%)' : '自起盤日起累積含息報酬 (%)',
            font: { color: '#E2E8F0', size: isMobile ? 11 : 13 }
          },
          gridcolor: 'rgba(255, 255, 255, 0.1)',
          linecolor: 'rgba(255, 255, 255, 0.25)',
          tickfont: { color: '#CBD5E1', size: isMobile ? 10 : 12 },
          ticksuffix: '%',
          zerolinecolor: 'rgba(255, 255, 255, 0.45)',
          zerolinewidth: 1.5,
          automargin: true,
          fixedrange: true // 物理級鎖定 Y 軸垂直拖曳！保證所有線條與波段永遠完全顯示，絕不被滑鼠拖掉
        },
        // 桌機/平板模式顯示水平頂部圖例，手機模式隱藏避免遮擋
        showlegend: isDesktopOrTablet,
        legend: {
          orientation: 'h',
          x: 0,
          y: 1.12,
          font: { size: 12, color: '#F8FAFC' },
          bgcolor: 'rgba(0,0,0,0)'
        }
      };

      // 右側端點數值標註（自動防重疊衝突分離算法）
      const rawAnnotations = [];
      traces.forEach(tr => {
        if (tr.x && tr.x.length > 0) {
          const lastX = tr.x[tr.x.length - 1];
          const lastY = tr.y[tr.y.length - 1];
          const ticker = tr.ticker || tr.name.split(' ')[0];
          rawAnnotations.push({
            x: lastX,
            y: lastY,
            originalY: lastY,
            color: tr.line.color,
            ticker: ticker,
            text: isMobile 
              ? `<b>${ticker}</b> ${lastY >= 0 ? '+' : ''}${lastY.toFixed(1)}%`
              : `<b>${ticker}</b> ${lastY >= 0 ? '+' : ''}${lastY.toFixed(2)}%`,
          });
        }
      });

      // 依 Y 值由小到大排序並做碰撞排斥分離 (Collision Avoidance)
      rawAnnotations.sort((a, b) => a.y - b.y);
      const minGap = isMobile ? 1.4 : 1.1; // 最小百分比間距防重疊
      for (let i = 1; i < rawAnnotations.length; i++) {
        if (rawAnnotations[i].y - rawAnnotations[i - 1].y < minGap) {
          rawAnnotations[i].y = rawAnnotations[i - 1].y + minGap;
        }
      }

      layout.annotations = rawAnnotations.map(item => ({
        x: item.x,
        y: item.y,
        xref: 'x',
        yref: 'y',
        text: item.text,
        showarrow: false,
        xanchor: 'left',
        xshift: isMobile ? 4 : 8,
        font: {
          color: item.color,
          size: isMobile ? 9.5 : 11
        }
      }));

      const config = {
        responsive: true,
        displayModeBar: true, // 手機與桌機皆保留右上角控制按鈕
        displaylogo: false,
        modeBarButtonsToRemove: ['lasso2d', 'select2d'] // 移除不常用的套索選取，保留縮放、平移、重設
      };

      Plotly.react('chart', traces, layout, config);
    }

    function switchMode(mode) {
      renderView(mode);
    }

    // 頁面初始化：依 0050 報酬自動載入對應模式
    window.addEventListener('DOMContentLoaded', () => {
      renderView(currentMode);
    });

    // 視窗大小改變時自適應動態重繪 (包含直立/橫向旋轉)
    window.addEventListener('resize', () => {
      const b = appData[currentMode];
      if (b) {
        renderPlotlyChart(b);
      }
    });
